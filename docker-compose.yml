services:

  postgres:
    image: postgres:16
    container_name: analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s



  redis:
    image: redis:7
    container_name: analytics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics-clickhouse
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/backend/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  django:
    build: ./services/backend
    container_name: analytics-django
    restart: unless-stopped
    command: >
      sh -c "python /app/wait_for_dependencies.py &&
             exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      TARA_WORKER_INSTALLER_PATH: /opt/tara-worker-dist/TaraWorkerSetup.exe
    volumes:
      - ./services/backend:/app
      - ./services/parser-browser/dist:/opt/tara-worker-dist:ro
    ports:
      - "18000:8000"
    depends_on:
      - postgres
      - redis
      - clickhouse
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-init:
    image: apache/airflow:2.10.5
    user: "0:0"
    container_name: analytics-airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: analytics_airflow_secret
      TZ: Europe/Moscow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Moscow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-postgres
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin
      "

  airflow-webserver:
    image: apache/airflow:2.10.5
    user: "0:0"
    container_name: analytics-airflow-webserver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: analytics_airflow_secret
      TZ: Europe/Moscow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Moscow
      PYTHONPATH: /opt/airflow/dags
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      - airflow-postgres
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5
    user: "0:0"
    container_name: analytics-airflow-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: analytics_airflow_secret
      TZ: Europe/Moscow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Moscow
      PYTHONPATH: /opt/airflow/dags
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./services/backend/logs:/opt/analytics-platform/services/backend/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-postgres
      - airflow-webserver
    command: scheduler

  airflow-postgres:
    image: postgres:16
    container_name: analytics-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data


  frontend:
    build: ./services/frontend
    container_name: analytics-frontend
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:18000/api
    depends_on:
      - django



  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: analytics-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: Europe/Moscow
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  clickhouse-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: analytics-clickhouse-ui
    restart: unless-stopped
    ports:
      - "5521:5521"
    depends_on:
      - clickhouse


volumes:
  postgres_data:
  clickhouse_data:
  airflow_postgres_data:
  pgadmin_data:
