services:

  postgres:
    image: postgres:16
    container_name: analytics-postgres
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: analytics-redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/backend/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml

  django:
    build: ./services/backend
    container_name: analytics-django
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - ./services/backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - clickhouse

volumes:
  postgres_data:
  clickhouse_data:

